name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ble-transport-v1
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Sherpa models
        run: |
          echo "Sherpa model files:"
          find android/app/src/main/assets/sherpa -type f -exec ls -lh {} \;

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Verify Sherpa models in APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)

          echo "APK: $APK"
          echo ""
          echo "Checking Sherpa models inside APK..."
          unzip -l "$APK" | grep "assets/sherpa"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: iTantra-release-apk
          path: android/app/build/outputs/apk/release/*.apk
